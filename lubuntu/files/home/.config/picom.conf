# macOS theme: window animations and rounded window corners (no general shadows).
# Undo: ~/.local/share/macos-theme/undo-animations

# same as Lubuntu's /etc/xdg/xdg-Lubuntu/picom.conf
backend = "xrender";

# soft macOS-style shadow; only windows with "shadow = true" in rules get one
shadow-radius = 24;
shadow-opacity = 0.35;
shadow-offset-x = -24;
shadow-offset-y = -16;

# Apps: open with fade + zoom from 95%, close/minimize with the reverse.
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    scale = 0.95; duration = 0.18; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.95; duration = 0.15; }
);

rules = (
  # things that must appear instantly or animate themselves
  { match = "window_type = 'dock' || window_type = 'desktop' || window_type = 'tooltip'"; animations = (); },
  { match = "class_g = 'Plank' || class_g = 'lxqt-panel'"; animations = (); },
  # menus: very quick fade only
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    scale = 1.0; duration = 0.08; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.06; }
    ); },
  # notifications slide in from the right
  { match = "class_g = 'lxqt-notificationd' || window_type = 'notification'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "slide-in";  direction = "left";  duration = 0.25; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.0; duration = 0.15; }
    ); },
  # Spotlight (small rofi window): quick fade + slight zoom
  { match = "class_g = 'Rofi'";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    scale = 0.97; duration = 0.12; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.97; duration = 0.10; }
    ); },
  # Launchpad (full-screen rofi): zoom down from 108% while fading in, like macOS
  { match = "class_g = 'Rofi' && width >= 1800";
    animations = (
      { triggers = [ "open", "show" ];  preset = "appear";    scale = 1.08; duration = 0.22; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 1.08; duration = 0.18; }
    ); }
  # password prompts: rounded corners + shadow, like macOS
  , { match = "class_g = 'Polkit-mate-authentication-agent-1'"; corner-radius = 12; shadow = true; }
  # rounded window corners like macOS: 10px for app windows, 6px for menus
  , { match = "window_type = 'normal' || window_type = 'dialog' || window_type = 'utility'"; corner-radius = 10; }
  , { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'"; corner-radius = 6; }
  # keep these square: bars, dock, desktop, Launchpad/Spotlight (draw their own), full-screen windows
  , { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Plank' || class_g = 'lxqt-panel' || class_g = 'Vala-panel' || class_g = 'Rofi' || fullscreen"; corner-radius = 0; }
  # the password prompt keeps its own 12px corners
  , { match = "class_g = 'Polkit-mate-authentication-agent-1'"; corner-radius = 12; }
);
